.lead{color:var(--muted)}
.step{font:500 .78rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--terra);margin:28px 0 8px}

.bodywrap{display:flex;justify-content:center;margin:8px 0 4px}
svg.figure{width:min(210px,52vw);height:auto;overflow:visible}
.figure .part{fill:var(--body);stroke:var(--paper);stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:fill .15s}
.figure .zone:hover .part,.figure .zone:focus-visible .part{fill:var(--bodyHover)}
.figure .zone:focus{outline:none}
.figure .zone.sel .part{fill:var(--terra)}
.figure .back{fill:none;stroke:var(--terra);stroke-width:2.5;stroke-dasharray:5 5;pointer-events:none;opacity:0;transition:opacity .15s}
.figure .back.on{opacity:1}

.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:400 .92rem var(--sans);border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:22px;padding:8px 14px;cursor:pointer}
.chip:hover{border-color:var(--terra)}
.chip[aria-pressed="true"]{background:var(--brown);color:var(--paper);border-color:var(--brown)}
.sens{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sens .chip{border-radius:10px;text-align:left;padding:12px 14px}
.sens .chip small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.sens .chip[aria-pressed="true"] small{color:var(--peach)}

.result{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--terra);border-radius:6px;padding:22px 20px 10px;margin-top:28px}
.where{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.feelings{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.feelings span::first-letter{text-transform:uppercase}
.feelings span{display:inline-block;background:var(--peach);color:var(--brown);border-radius:20px;padding:5px 12px;font-weight:500;font-size:.95rem}
.box{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.question{font-family:var(--serif);font-size:1.2rem;color:var(--brown);margin:2px 0 14px}
.ex ol{margin:6px 0 12px;padding-left:20px}
.ex li{margin-bottom:4px}
.hint{font-size:.85rem;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{font:500 .95rem var(--sans);border:none;border-radius:40px;padding:12px 20px;cursor:pointer;background:var(--brown);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--brown);border:1.5px solid var(--brown)}
.btn:hover{background:var(--terra);color:#fff;border-color:var(--terra)}

.info{margin-top:44px;border-top:1px solid var(--line);padding-top:8px}
.info details{border-bottom:1px solid var(--line);padding:12px 0}
.info summary{cursor:pointer;font-weight:500;color:var(--brown)}
.info details p{margin:10px 0 4px;font-size:.93rem}
.contact{background:#451b0c;color:#ebe2da;border-radius:6px;padding:22px 20px;margin-top:32px}
.contact p{margin:0 0 14px}
.contact a.btn{display:inline-block;background:#fcd8b4;color:#451b0c;text-decoration:none}
.contact a.btn:hover{background:var(--terra);color:#fff}
footer.legal{display:flex;justify-content:center;gap:18px;font-size:.78rem;color:var(--muted);margin-top:24px}
footer.legal a{color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const REGIONS=["kopf","kiefer","hals","schultern","brust","bauch","ruecken","arme","beine"];
const SENS=["eng","druck","warm","kalt","kribbelig","schwer","leer","unruhig"];
const STUDY="https://doi.org/10.1073/pnas.1321664111";

const store={get(k,d){try{const v=localStorage.getItem("ks_"+k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem("ks_"+k,v)}catch(e){}}};
let lang=store.get("lang",null)||(()=>{try{const s=localStorage.getItem("site_lang");if(s&&T[s])return s}catch(e){}const l=(navigator.language||"de").slice(0,2);return T[l]?l:"de"})();
if(!T[lang]) lang="de";
let region=null, sens=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderLangs(){
  const langs=Object.keys(T);
  $("langs").innerHTML = langs.length>1 ? langs.map(l=>`<button data-lang="${l}" aria-pressed="${l===lang}">${l.toUpperCase()}</button>`).join("") : "";
  $("langs").querySelectorAll("button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("lang",lang);renderAll()});
}
function renderStatic(){
  const t=T[lang]; document.documentElement.lang=lang; document.title=t.title+" · Dr. Mandy Zimmermann";
  const map={tTitle:"title",tIntro:"intro",tStep1:"step1",tStep2:"step2",tResH:"resH",tMedH:"medH",tMed:"med",tPrivH:"privH",tPriv:"priv",tInstH:"instH",tInst:"inst",tContact:"contact",tContactBtn:"contactBtn",tLegal:"legal",tPrivacy:"privacy"};
  for(const id in map) $(id).textContent=t[map[id]];
  $("tRes").innerHTML=esc(t.res)+` <a href="${STUDY}" target="_blank" rel="noopener">${esc(t.resLink)}</a>`;
  document.querySelectorAll(".zone").forEach(z=>z.setAttribute("aria-label",t.regions[z.dataset.r]));
}
function renderRegions(){
  const t=T[lang];
  $("regionChips").innerHTML=REGIONS.map(r=>`<button class="chip" data-r="${r}" aria-pressed="${r===region}">${esc(t.regions[r])}</button>`).join("");
  $("regionChips").querySelectorAll("button").forEach(b=>b.onclick=()=>pickRegion(b.dataset.r));
  document.querySelectorAll(".zone").forEach(z=>z.classList.toggle("sel",z.dataset.r===region));
  $("backOutline").classList.toggle("on",region==="ruecken");
}
function renderSens(){
  const t=T[lang];
  if(!region){$("sensSec").hidden=true;return}
  $("sensSec").hidden=false;
  const avail=SENS.filter(s=>t.map[region][s]);
  $("sensChips").innerHTML=avail.map(s=>`<button class="chip" data-s="${s}" aria-pressed="${s===sens}">${esc(t.sens[s][0])}<small>${esc(t.sens[s][1])}</small></button>`).join("");
  $("sensChips").querySelectorAll("button").forEach(b=>b.onclick=()=>pickSens(b.dataset.s));
}
function renderResult(){
  const t=T[lang], box=$("result");
  if(!region||!sens||!t.map[region][sens]){box.hidden=true;return}
  const [feel,expl,q,exId]=t.map[region][sens], ex=t.ex[exId];
  box.innerHTML=`
    <div class="where">${esc(t.regions[region])} · ${esc(t.sens[sens][0])}</div>
    <h2>${esc(t.feelingsH)}</h2>
    <div class="feelings">${feel.split(", ").map(f=>`<span>${esc(f)}</span>`).join("")}</div>
    <p>${esc(expl)}</p>
    <div class="box"><h3>${esc(t.questionH)}</h3><p class="question">${esc(q)}</p></div>
    <div class="box ex"><h3>${esc(t.exH)}: ${esc(ex[0])}</h3><ol>${ex[1].map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>
    <p class="hint">${esc(t.hint)}</p>
    <div class="actions"><button class="btn ghost" id="btnSens">${esc(t.otherSens)}</button><button class="btn ghost" id="btnRegion">${esc(t.otherRegion)}</button></div>`;
  box.hidden=false;
  $("btnSens").onclick=()=>{sens=null;renderAll();$("sensSec").scrollIntoView({behavior:"smooth",block:"start"})};
  $("btnRegion").onclick=()=>{region=null;sens=null;renderAll();$("tStep1").scrollIntoView({behavior:"smooth",block:"start"})};
}
function pickRegion(r){
  region=r; sens=null; renderAll();
  requestAnimationFrame(()=>$("sensSec").scrollIntoView({behavior:"smooth",block:"start"}));
}
function pickSens(s){
  sens=s; renderAll();
  requestAnimationFrame(()=>$("result").scrollIntoView({behavior:"smooth",block:"start"}));
}
function renderAll(){renderLangs();renderStatic();renderRegions();renderSens();renderResult()}

document.querySelectorAll(".zone").forEach(z=>{
  z.addEventListener("click",()=>pickRegion(z.dataset.r));
  z.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pickRegion(z.dataset.r)}});
});
renderAll();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
