.label{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}

.stepper{display:flex;align-items:center;gap:4px;grid-row:span 2;align-self:center}

.count{min-width:2ch;text-align:center;font:600 1.15rem var(--serif);font-variant-numeric:tabular-nums}
.summary-line{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.btn{font:500 1.05rem var(--sans);border-radius:12px;padding:15px 18px;border:none;cursor:pointer;width:100%}
.btn-primary{background:var(--terra);color:#fff}
.btn-quiet{background:var(--sand);color:var(--brown)}
.btn:disabled{opacity:.45;cursor:default}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.note{font-size:.8rem;color:var(--muted);margin:0}

.amount.paused{color:var(--muted)}

details{border-top:1px solid var(--line);padding-top:6px}
summary{cursor:pointer;padding:8px 0;color:var(--muted);font-weight:500}

.result .amount{font-size:clamp(3.2rem,18vw,5.4rem)}
.joke{font-family:var(--serif);font-size:1.25rem;color:var(--brown);margin:6px 0 0;text-wrap:balance}

[hidden]{display:none!important}
.fields{display:grid;grid-template-columns:1fr;gap:12px}

    <div class="btn-row">
      <button class="btn btn-quiet" id="pauseBtn"></button>
      <button class="btn btn-primary" id="endBtn"></button>
    </div>
    <details>
      <summary id="tAdjust"></summary>
      <div class="roles" id="rolesLive"></div>
    </details>
  </section>

  <!-- Ergebnis -->
  <section id="vResult" hidden style="flex-direction:column;gap:20px">
    <div class="result">
      <div class="label" id="tResultLabel"></div>
      <div class="amount" id="resAmount"></div>

  </section>
  <footer class="legal"><a href="/legal.html" id="tLegal"></a><a href="/privacy.html" id="tPrivacy"></a></footer>
</div>

}
function settle(){ if(S&&S.running){const c=current();S.cost=c.cost;S.ms=c.ms;S.lastTs=Date.now()} }
function save(){store.set("rates",rates);store.set("counts",counts);store.set("session",S)}

function compare(cost){
  let pick=null; for(const it of ITEMS){ if(cost>=it.p) pick=it; }
  if(!pick) return null;
  const n=Math.floor(cost/pick.p);
  const nf=new Intl.NumberFormat(T[lang].locale).format(n);
  return {n:nf,item:pick[lang][n===1?0:1]};
}

function renderRoles(el,live){
  el.innerHTML="";
  t("roles").forEach((name,i)=>{
    const row=document.createElement("div");row.className="role";
    row.innerHTML=`<div class="role-name">${name}</div>
      <div class="stepper"><button aria-label="−">−</button><span class="count">${counts[i]}</span><button aria-label="+">+</button></div>
      <label class="rate"><input id="rate${live?"L":"S"}${i}" type="number" inputmode="decimal" min="0" step="5" value="${rates[i]}"> ${t("perHourUnit")}</label>`;
    const [minus,plus]=row.querySelectorAll(".stepper button");
    minus.onclick=()=>{settle();counts[i]=Math.max(0,counts[i]-1);afterChange()};
    plus.onclick=()=>{settle();counts[i]=Math.min(99,counts[i]+1);afterChange()};
    row.querySelector("input").onchange=e=>{settle();rates[i]=Math.max(0,parseFloat(e.target.value)||0);afterChange()};
    el.appendChild(row);
  });
}
function afterChange(){
  if(S){S.rate=perHour();S.maxPeople=Math.max(S.maxPeople||0,people())}
  save(); renderAll();
}

function show(view){
  ["vSetup","vLive","vResult"].forEach(v=>{const el=$(v);el.hidden=v!==view;if(v===view)el.style.display="flex"});
}

function renderTexts(){
  document.documentElement.lang=lang;
  $("appName").textContent=t("app");
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const map={tSetupH:"setupH",tSetupLead:"setupLead",tWho:"who",tRateNote:"rateNote",tPerHour:"perHour",startBtn:"start",
    tLiveLabel:"liveLabel",tTime:"time",tPerMin:"perMin",tPeople:"people",endBtn:"end",tAdjust:"adjust",
    tResultLabel:"resultLabel",tResTime:"resTime",tResPeople:"resPeople",tResYear:"resYear",newBtn:"newM",tContact:"contact",segLive:"segLive",segPlan:"segPlan",tDur:"dur",tFreq:"freq",tPlanCost:"planCost",copyBtn:"copy",tLegal:"legal",tPrivacy:"privacy",tInstallH:"installH",installBtn:"installBtn"};
  $("tInstallTxt").textContent=installMode==="prompt"?"":(isIOS?t("installIos"):t("installOther"));
  for(const id in map) $(id).textContent=t(map[id]);
}

function renderAll(){
  renderTexts();
  if(!S){
    show("vSetup"); renderRoles($("rolesSetup"),false);
    $("setupPerHour").textContent=money(perHour(),0);
    $("startBtn").disabled=people()===0;
    renderPlan();
  } else if(S.ended){
    show("vResult");
    $("resAmount").textContent=money(S.cost);
    const c=compare(S.cost);
    $("resJoke").textContent=c?t("joke").replace("{n}",c.n).replace("{item}",c.item):t("jokeNone");
    $("resTime").textContent=fmtTime(S.ms);
    $("resPeople").textContent=S.maxPeople||people();
    $("resYear").textContent=money(S.cost*45,0);
  } else {
    show("vLive"); renderRoles($("rolesLive"),true);
    $("pauseBtn").textContent=S.running?t("pause"):t("resume");
    $("livePeople").textContent=people();
    $("livePerMin").textContent=money(perHour()/60);
    tick(true);
  }
}

function tick(once){
  if(!S||S.ended) return;
  const c=current();
  $("liveAmount").textContent=money(c.cost);
  $("liveAmount").classList.toggle("paused",!S.running);
  $("liveTime").textContent=fmtTime(c.ms);
  const cmp=compare(c.cost);
  const txt=cmp?t("cmp").replace("{n}",cmp.n).replace("{item}",cmp.item):t("cmpNone");
  if($("liveCompare").textContent!==txt) $("liveCompare").textContent=txt;
  if(!once){ raf=setTimeout(()=>tick(false),200) }
}
function loop(){ clearTimeout(raf); if(S&&S.running&&!S.ended) tick(false); }

async function lockScreen(on){
  try{
    if(on&&"wakeLock" in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request("screen");wakeLock.addEventListener("release",()=>wakeLock=null)}
    if(!on&&wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&S&&S.running&&!S.ended)lockScreen(true)});

$("startBtn").onclick=()=>{S={cost:0,ms:0,lastTs:Date.now(),running:true,rate:perHour(),maxPeople:people(),ended:false};save();renderAll();loop();lockScreen(true)};
$("pauseBtn").onclick=()=>{settle();S.running=!S.running;S.lastTs=Date.now();save();renderAll();loop();lockScreen(S.running)};
$("endBtn").onclick=()=>{settle();S.running=false;S.ended=true;save();clearTimeout(raf);lockScreen(false);renderAll()};
$("newBtn").onclick=()=>{S=null;save();renderAll()};
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set("lang",lang);renderAll()});

// Planungsmodus
const DURS=[15,30,45,60,90,120], YEARLY=[0,45,22,11];
let mode=store.get("mode","live"), planDur=store.get("planDur",60), planFreq=store.get("planFreq",1);
function itemPhrase(cost){
  let pick=null; for(const it of ITEMS){ if(cost>=it.p) pick=it; }
  if(!pick) return null;
  const n=Math.floor(cost/pick.p), name=pick[lang];
  if(n===1){
    if(lang==="de") return {acc:pick.a[0]+" "+name[0], nom:pick.a[1]+" "+name[0]};
    const a=lang==="en"?pick.a[2]:pick.a[3]; return {acc:a+" "+name[0], nom:a+" "+name[0]};
  }
  const x=new Intl.NumberFormat(T[lang].locale).format(n)+" "+name[1]; return {acc:x,nom:x};
}
function renderPlan(){
  const segL=$("segLive"),segP=$("segPlan");
  segL.setAttribute("aria-selected",mode==="live");segP.setAttribute("aria-selected",mode==="plan");
  $("paneLive").hidden=mode!=="live";$("panePlan").hidden=mode!=="plan";
  $("planDur").innerHTML=DURS.map(d=>`<option value="${d}"${d===planDur?" selected":""}>${d} ${t("min")}</option>`).join("");
  $("planFreq").innerHTML=t("freqs").map((f,i)=>`<option value="${i}"${i===planFreq?" selected":""}>${f}</option>`).join("");
  const cost=perHour()*planDur/60, rCost=Math.max(10,Math.round(cost/10)*10), year=Math.round(cost*YEARLY[planFreq]/100)*100;
  $("planCost").textContent=money(rCost,0);
  let txt=t("planOnce").replace("{cost}",money(rCost,0)).replace("{n}",people()).replace("{d}",planDur);
  const ip=itemPhrase(rCost); if(ip) txt+=t("planJoke").replace("{acc}",ip.acc).replace("{nom}",ip.nom);
  if(false) txt+=t("planRec").replace("{f}",t("freqAdj")[planFreq]).replace("{y}",money(year,0));
  txt+=t("planSig");
  $("planText").textContent=txt;
  $("copyBtn").disabled=people()===0;
}
$("segLive").onclick=()=>{mode="live";store.set("mode",mode);renderPlan()};
$("segPlan").onclick=()=>{mode="plan";store.set("mode",mode);renderPlan()};
$("planDur").onchange=e=>{planDur=+e.target.value;store.set("planDur",planDur);renderPlan()};
$("planFreq").onchange=e=>{planFreq=+e.target.value;store.set("planFreq",planFreq);renderPlan()};
$("copyBtn").onclick=()=>{
  const txt=$("planText").textContent;
  const done=()=>{$("copied").textContent=t("copied");setTimeout(()=>$("copied").textContent="",3500)};
  const fallback=()=>{const r=document.createRange();r.selectNodeContents($("planText"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);try{document.execCommand("copy");done()}catch(e){}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(fallback)}else fallback();
};


// Installation als App
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const mobile=/android|iphone|ipad|ipod/i.test(navigator.userAgent)||isIOS;
let installMode=null, deferredPrompt=null;
function showInstall(){ if(standalone||store.get("installDismissed",false)) return; $("install").hidden=false; renderTexts(); }
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;installMode="prompt";$("installBtn").hidden=false;showInstall()});
if(mobile&&!standalone){ installMode=isIOS?"ios":"other"; setTimeout(()=>{if(!deferredPrompt)showInstall()},1500); }
$("installBtn").onclick=async()=>{ if(!deferredPrompt)return; deferredPrompt.prompt(); await deferredPrompt.userChoice.catch(()=>{}); deferredPrompt=null; $("install").hidden=true; };
$("installX").onclick=()=>{ $("install").hidden=true; store.set("installDismissed",true); };
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
renderAll(); loop();
</script>
</body>
</html>
